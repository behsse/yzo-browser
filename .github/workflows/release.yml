# Builds Yzo for Windows, macOS and Linux and publishes the installers to a GitHub release
# (electron-updater reads them from there). Triggered by pushing a tag such as v0.6.0.
#
# Optional repository secrets:
#   EVS_ACCOUNT_NAME / EVS_PASSWD  castLabs EVS account, enables production VMP signing (Netflix-class DRM)
#   CSC_LINK / CSC_KEY_PASSWORD    code-signing certificate (Windows .pfx or macOS .p12, base64)
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID  macOS notarization
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HAS_EVS: ${{ secrets.EVS_ACCOUNT_NAME != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test

      # A dedicated Python: the runners' system Python refuses pip installs (PEP 668 on macOS).
      - uses: actions/setup-python@v5
        if: env.HAS_EVS == 'true' && matrix.os != 'ubuntu-latest'
        with:
          python-version: "3.12"
      - name: Set up castLabs EVS
        if: env.HAS_EVS == 'true' && matrix.os != 'ubuntu-latest'
        shell: bash
        run: |
          python -m pip install --upgrade castlabs-evs
          python -m castlabs_evs.account reauth -A "${{ secrets.EVS_ACCOUNT_NAME }}" -P "${{ secrets.EVS_PASSWD }}"
          echo "YZO_VMP_SIGN=1" >> "$GITHUB_ENV"
          echo "PYTHON=python" >> "$GITHUB_ENV"

      - name: Build and publish
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Missing secrets arrive as empty strings, which electron-builder reads as set
          # (an empty CSC_LINK resolves to the working directory: "not a file").
          extra=()
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # Without a certificate, macOS gets an ad-hoc signature: arm64 refuses to run unsigned code.
            [ "${{ matrix.os }}" = "macos-latest" ] && extra+=(-c.mac.identity=-)
          fi
          [ -z "$APPLE_ID" ] && unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          pnpm build && pnpm exec electron-builder ${{ matrix.target }} "${extra[@]}" --publish always
